[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-google-home-bt-proxy"
version = "0.1.0"
description = "Home Assistant Google Home Bluetooth Proxy for Bermuda BLE Tracking"
authors = [{name = "Steven T. Pelech"}]
license = {text = "MIT"}
requires-python = ">=3.13.2"
dependencies = [
    "glocaltokens>=0.7.6",
    "homeassistant==2026.1.0",
    "habluetooth>=3.8.0",
    "bluetooth-data-tools>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.4",
    "mypy>=1.19.1",
    "homeassistant-stubs==2026.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/google_home_bt_proxy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
