<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Home Auth Helper</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #202124;
      --text-secondary: #5f6368;
      --border: #dadce0;
      --input-bg: #f8f9fa;
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --secondary: #5f6368;
      --secondary-hover: #3c4043;
      --success: #1e8e3e;
      --error: #d93025;
      --warning: #f9ab00;
      --card-bg: #f1f3f4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --text: #e8eaed;
        --text-secondary: #9aa0a6;
        --border: #3c4043;
        --input-bg: #2d2e30;
        --primary: #8ab4f8;
        --primary-hover: #aecbfa;
        --secondary: #9aa0a6;
        --secondary-hover: #bdc1c6;
        --success: #81c995;
        --error: #f28b82;
        --warning: #fdd663;
        --card-bg: #292a2d;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
      line-height: 1.4;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .header svg {
      width: 24px;
      height: 24px;
      fill: var(--primary);
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .header-text p {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      font-size: 12px;
      color: var(--text);
    }

    .hint {
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    input[type="text"],
    input[type="email"],
    input[type="url"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      background-color: var(--input-bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }

    .button-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 0.15s, opacity 0.15s;
      width: 100%;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-save {
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-save:hover:not(:disabled) {
      background-color: var(--border);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      .btn-primary {
        color: #202124;
        font-weight: 600;
      }
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--border);
    }

    .status-panel {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 6px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
      background-color: var(--secondary);
    }

    .status-dot.success { background-color: var(--success); }
    .status-dot.error { background-color: var(--error); }
    .status-dot.waiting { background-color: var(--warning); }
    .status-dot.sending { background-color: var(--primary); }

    .status-body {
      flex: 1;
    }

    .status-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .status-text {
      font-size: 12px;
      color: var(--text);
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24">
      <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3zm0 2.84L18 11v7h-2v-6H8v6H6v-7l6-5.16z"/>
    </svg>
    <div class="header-text">
      <h1>Google Home Auth Helper</h1>
      <p>Automated OAuth Token Relay</p>
    </div>
  </div>

  <form id="config-form">
    <div class="form-group">
      <label for="ha-url">Home Assistant URL</label>
      <input type="url" id="ha-url" placeholder="http://homeassistant.local:8123" required />
      <div class="hint">Base URL of your Home Assistant instance.</div>
    </div>

    <div class="form-group">
      <label for="email">Google Email Address</label>
      <input type="email" id="email" placeholder="example@gmail.com" required />
      <div class="hint">The account used for Google Home.</div>
    </div>

    <div class="form-group">
      <label for="flow-id">Config Flow ID (Optional)</label>
      <input type="text" id="flow-id" placeholder="Optional flow ID" />
      <div class="hint">If adding via config flow, paste the flow ID to auto-advance it.</div>
    </div>

    <div class="button-stack">
      <button type="submit" id="save-btn" class="btn-save">Save Settings</button>
      <button type="button" id="login-btn" class="btn-primary">Start Google Login</button>
      <button type="button" id="check-cookie-btn" class="btn-secondary">Check / Send Current Cookie</button>
    </div>
  </form>

  <div class="status-panel">
    <div id="status-dot" class="status-dot"></div>
    <div class="status-body">
      <div class="status-title">Status</div>
      <div id="status-text" class="status-text">Ready</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
