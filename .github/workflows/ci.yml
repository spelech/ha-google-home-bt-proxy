name: CI Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate1_integrity:
    name: Gate 1 - Manifest, Version & Link Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Release Verification & Link Integrity Engine
        run: python3 scripts/verify_release.py --skip-tests --ci

  gate2_lint_format:
    name: Gate 2 - Ruff Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

  gate3_tests_coverage:
    name: Gate 3 - Pytest Suite & Coverage (>= 80%)
    runs-on: ubuntu-latest
    needs: [gate1_integrity, gate2_lint_format]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run Test Suite with Coverage
        run: uv run pytest --cov=custom_components/google_home_bt_proxy --cov-fail-under=80 -v

  gate4_security:
    name: Gate 4 - CodeQL Security Analysis
    runs-on: ubuntu-latest
    needs: [gate3_tests_coverage]
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
